<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>TikTok Desktop</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
<main class="surface">
  <div id="site-pane" aria-label="TikTok website"></div>
  <footer id="notice-bar" hidden>
    <span id="notice" role="status"></span>
    <div class="notice-actions">
      <button id="open-qr-sign-in" type="button" hidden>Use QR code</button>
      <button id="dismiss-notice" type="button">Dismiss</button>
    </div>
  </footer>
</main>
</body>
</html>
