<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>TikTok Desktop tray menu</title>
  <link rel="stylesheet" href="tray.css">
  <script type="module" src="tray.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
  <symbol id="chevron" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
  <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="m9 15-5 5m6-6-4-4 4-1 5-5 5 5-5 5-1 4z"/></symbol>
  <symbol id="taskbar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M4 14h16m-10 2.5h4"/></symbol>
  <symbol id="update" viewBox="0 0 24 24"><path d="M12 3v11m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
  <symbol id="quit" viewBox="0 0 24 24"><path d="M12 3v8m-4.5-6a8 8 0 1 0 9 0"/></symbol>
</svg>
<header class="brand">
  <span class="brand-icon"><canvas id="brand-icon" aria-hidden="true"></canvas></span>
  <h1 id="brand-name">TikTok Desktop</h1>
  <span class="version" id="version"></span>
</header>
<main role="menu" aria-labelledby="brand-name">
  <button class="item primary" role="menuitem" data-action="open" tabindex="0">
    <span class="play"><svg aria-hidden="true"><use href="#play"/></svg></span>
    <span>Open TikTok<small>Show the app window</small></span>
    <svg class="chevron" aria-hidden="true"><use href="#chevron"/></svg>
  </button>
  <button class="item settings" role="menuitem" data-action="settings" tabindex="-1">
    <svg aria-hidden="true"><use href="#sliders"/></svg><span>Settings</span>
    <svg class="chevron" aria-hidden="true"><use href="#chevron"/></svg>
  </button>
  <div class="window-options" role="group" aria-labelledby="window-label">
    <h2 id="window-label">Window</h2>
    <button class="item" role="menuitemcheckbox" aria-checked="false" data-action="alwaysOnTop" tabindex="-1">
      <svg aria-hidden="true"><use href="#pin"/></svg><span>Always on top</span>
      <span class="toggle" aria-hidden="true"><span>Off</span><i></i></span>
    </button>
    <button class="item" role="menuitemcheckbox" aria-checked="false" data-action="hideFromTaskbar" tabindex="-1">
      <svg aria-hidden="true"><use href="#taskbar"/></svg><span>Hide from taskbar</span>
      <span class="toggle" aria-hidden="true"><span>Off</span><i></i></span>
    </button>
  </div>
  <div class="utility" role="group" aria-label="App actions">
    <button class="item" role="menuitem" data-action="updates" tabindex="-1">
      <svg aria-hidden="true"><use href="#update"/></svg><span>Check for updates</span>
    </button>
    <button class="item quit" role="menuitem" aria-label="Quit TikTok Desktop" data-action="quit" tabindex="-1">
      <svg aria-hidden="true"><use href="#quit"/></svg><span>Quit</span>
    </button>
  </div>
</main>
<div id="tray-error" role="status" hidden></div>
</body>
</html>
